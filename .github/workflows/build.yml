name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build standalone EXE
        run: dotnet publish ./BlankWindowsApp/BlankWindowsApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BlankWindowsApp-Windows-x64
          path: BlankWindowsApp/bin/Release/net8.0-windows/win-x64/publish/BlankWindowsApp.exe
          if-no-files-found: error
          retention-days: 30
